<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cap Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a slim control rail on top, then two working panes - player board and lineup builder. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #142019;
  --muted: #5b6b61;
  --line: #d9e0db;
  --turf: #1f7a4d;
  --turf-ink: #ffffff;
  --turf-soft: #e3f1e9;
  --gold: #a86f00;
  --warn: #b5470b;
  --warn-soft: #fbe9de;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --surface: #17211b; --ink: #e6eee9; --muted: #95a69b; --line: #2a3830;
    --turf: #3fb57a; --turf-ink: #06140c; --turf-soft: #1b3326; --gold: #e2ad3b; --warn: #f08a4b; --warn-soft: #3a2316;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #17211b; --ink: #e6eee9; --muted: #95a69b; --line: #2a3830;
  --turf: #3fb57a; --turf-ink: #06140c; --turf-soft: #1b3326; --gold: #e2ad3b; --warn: #f08a4b; --warn-soft: #3a2316;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(12px, env(safe-area-inset-top, 0px)) 40px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 2.1rem; font-weight: 800; line-height: 1; }
h1 span { color: var(--turf); }
h2 { font-size: 1.35rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-top: 6px; }
.status { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .86rem; color: var(--muted); }
.status b { color: var(--ink); font-weight: 600; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
select, button, input { font: inherit; color: inherit; }
select, input[type=number] {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-height: 38px;
}
button { cursor: pointer; border-radius: 6px; min-height: 38px; padding: 7px 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
button:hover { border-color: var(--turf); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--turf); outline-offset: 2px; }
button.primary { background: var(--turf); color: var(--turf-ink); border-color: var(--turf); }
button:disabled { opacity: .5; cursor: progress; }

.banner { border-radius: 8px; padding: 10px 14px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; align-items: start; }
@media (max-width: 920px) { .panes { grid-template-columns: minmax(0, 1fr); } }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; display: grid; gap: 12px; }
.pane-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button { min-height: 32px; padding: 4px 11px; font-family: var(--font-display); font-size: 1rem; letter-spacing: .04em; }
.tabs button[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.table-scroll { overflow-x: auto; max-height: 640px; overflow-y: auto; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; font-family: var(--font-display); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; font-size: .8rem; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.r, th.r { text-align: right; }
.pos { display: inline-block; min-width: 34px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: .8rem; letter-spacing: .05em; border-radius: 4px; padding: 1px 5px; background: var(--turf-soft); color: var(--turf); }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; border-radius: 4px; padding: 0 5px; margin-left: 6px; background: var(--warn-soft); color: var(--warn); vertical-align: 1px; }
.player small { color: var(--muted); margin-left: 6px; }

.builds { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.build { text-align: left; display: grid; gap: 2px; padding: 10px 12px; min-height: 64px; }
.build strong { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .02em; }
.build span { font-weight: 400; font-size: .8rem; color: var(--muted); }
.build[aria-pressed=true] { border-color: var(--turf); background: var(--turf-soft); }

details.settings { font-size: .88rem; }
details.settings summary { cursor: pointer; color: var(--muted); font-weight: 600; }
.settings-grid { display: flex; flex-wrap: wrap; gap: 12px 20px; padding-top: 10px; align-items: center; }
.settings-grid label { display: flex; gap: 8px; align-items: center; }
.settings-grid input[type=number] { width: 100px; }

.results { display: grid; gap: 14px; }
.result-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.explain { font-size: .86rem; color: var(--muted); max-width: 70ch; margin: 0; }
.lineup { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lineup-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; padding: 8px 12px; background: var(--turf-soft); }
.lineup-top h3 { font-size: 1.1rem; }
.lineup-top .figs { display: flex; gap: 14px; font-size: .88rem; }
.lineup table td { border-bottom: 1px solid var(--line); }
.lineup tr:last-child td { border-bottom: 0; }
.slot { font-family: var(--font-display); font-weight: 700; color: var(--muted); width: 48px; }
.anchor td { background: color-mix(in srgb, var(--gold) 12%, transparent); }
.left-gold { color: var(--gold); font-weight: 600; }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
.export { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .86rem; }
footer { font-size: .8rem; color: var(--muted); max-width: 90ch; }

.mode { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 3px; background: var(--surface); gap: 3px; }
.mode button { border: 0; min-height: 32px; padding: 4px 14px; font-family: var(--font-display); font-size: 1.02rem; letter-spacing: .04em; }
.mode button[aria-pressed=true] { background: var(--turf); color: var(--turf-ink); }
.lockcell { width: 1%; white-space: nowrap; }
.lockbtn { min-height: 28px; padding: 2px 8px; font-size: .78rem; font-weight: 600; color: var(--muted); }
.lockbtn + .lockbtn { margin-left: 4px; }
.lockbtn[aria-pressed=true] { background: var(--gold); border-color: var(--gold); color: var(--surface); }
tr.locked td { background: color-mix(in srgb, var(--gold) 9%, transparent); }
.locks { display: grid; gap: 8px; border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; }
.locks-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; font-size: .88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--gold); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: .85rem; }
.chip b { font-family: var(--font-display); color: var(--gold); letter-spacing: .04em; }
.chip button { min-height: 24px; padding: 0 8px; border-radius: 999px; border: 0; font-size: .8rem; color: var(--muted); }
.lock-warn { color: var(--warn); font-size: .85rem; }
.build.mine { border-style: dashed; }
td.slot.cpt { color: var(--gold); }
.pos-inline { display: none; }
@media (max-width: 560px) {
  .c-rank, .c-val, .c-game, .c-pos { display: none; }
  .pos-inline { display: inline !important; }
  .lineup td.muted { display: none; }
  .player small { display: block; margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .lineup { animation: rise .25s ease-out both; } @keyframes rise { from { transform: translateY(4px); opacity: .6; } } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Cap <span>Room</span></h1>
      <div class="status" id="status"><span>Loading projections and salaries...</span></div>
    </div>
    <div class="controls">
      <div class="mode" id="sport" role="group" aria-label="Sport">
        <button type="button" data-sport="nfl" aria-pressed="true">NFL</button>
        <button type="button" data-sport="nba" aria-pressed="false">NBA</button>
      </div>
      <div class="mode" id="mode" role="group" aria-label="Contest type">
        <button type="button" data-mode="classic" aria-pressed="true">Classic</button>
        <button type="button" data-mode="showdown" aria-pressed="false">Showdown</button>
      </div>
      <label for="slate" class="muted">Slate</label>
      <select id="slate" aria-label="DraftKings slate"></select>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="panes">
    <section class="pane" aria-labelledby="board-h">
      <div class="pane-head">
        <h2 id="board-h">Projections</h2>
        <div class="tabs" id="postabs" role="group" aria-label="Filter by position"></div>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Lock</th><th class="r c-rank">#</th><th>Player</th><th class="c-pos">Pos</th><th class="r">DK Pts</th><th class="r" id="salhead">Salary</th><th class="r c-val">Pts/$1K</th><th class="c-game">Game</th></tr></thead>
          <tbody id="board"><tr><td colspan="8" class="muted">Loading players...</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="pane" aria-labelledby="build-h">
      <div class="pane-head"><h2 id="build-h">Build lineups</h2><span class="muted" id="modehint"></span></div>
      <div class="locks" id="locks">
        <div class="locks-head"><span id="lockcount">No locked players.</span><button type="button" id="clearlocks" hidden>Clear all</button></div>
        <div class="chips" id="chips"></div>
        <div class="lock-warn" id="lockwarn" hidden></div>
      </div>
      <div class="builds" id="builds"></div>
      <div class="controls"><button type="button" class="primary" id="buildall">Build all</button></div>
      <details class="settings">
        <summary>Balanced lineup rules</summary>
        <div class="settings-grid">
          <label for="minqb" data-sport-only="nfl">QB salary at least <input type="number" id="minqb" min="0" max="12000" step="100" value="5000"></label>
          <label for="minsal" data-sport-only="nfl">RB, WR, TE salary at least <input type="number" id="minsal" min="0" max="12000" step="100" value="4000"></label>
          <label for="minnba" data-sport-only="nba">Player salary at least <input type="number" id="minnba" min="0" max="12000" step="100" value="4000"></label>
          <label for="noq"><input type="checkbox" id="noq" checked> Leave out Questionable players</label>
        </div>
      </details>
      <div class="results" id="results">
        <div class="empty">Lock any players you want, then pick a lineup type above.</div>
      </div>
    </section>
  </div>

  <footer id="footer"></footer>
</div>

<script>
"use strict";
const HIGHS_CDN = "https://cdn.jsdelivr.net/npm/highs@1.15.4/build/";
const URLS = {
  groups: sport => `https://api.draftkings.com/draftgroups/v1/?sport=${sport}`,
  draftables: id => `https://api.draftkings.com/draftgroups/v1/draftgroups/${id}/draftables`,
  rules: gameType => `https://api.draftkings.com/lineups/v1/gametypes/${gameType}/rules`,
  state: sport => `https://api.sleeper.app/v1/state/${sport}`,
  projNFL: (season, week) => `https://api.sleeper.com/projections/nfl/${season}/${week}?season_type=regular` +
    ["QB", "RB", "WR", "TE", "K", "DEF"].map(p => `&position[]=${p}`).join(""),
  projNBA: (season, week) => `https://api.sleeper.com/projections/nba/${season}/${week}?season_type=regular`,
};

/* Each sport: DraftKings contest types, roster rules, position tabs and the "Top X Lineup" anchors. */
const SPORTS = {
  nfl: {
    name: "NFL", dk: "NFL", tabs: ["QB", "RB", "WR", "TE", "K", "DST"], anchors: ["QB", "RB", "WR", "TE"],
    modes: {
      classic: { contestType: 21, gameType: 1, name: "Classic", size: 9, header: "QB,RB,RB,WR,WR,WR,TE,FLEX,DST", hint: "QB, 2 RB, 3 WR, TE, FLEX, DST" },
      showdown: { contestType: 96, gameType: 96, name: "Showdown", size: 6, cptSlot: 511, flexName: "FLEX", header: "CPT,FLEX,FLEX,FLEX,FLEX,FLEX", hint: "1 Captain (1.5x) + 5 FLEX" },
    },
    footer: "NFL projections are Sleeper's weekly projected stats, converted to DraftKings scoring: full PPR, 4 per passing TD, -1 per interception or fumble lost, +3 at 300 passing or 100 rushing/receiving yards (scored as the chance of reaching it), DraftKings defense scoring, and for Showdown kickers 1 per extra point and 3/4/5 per field goal by distance. Players listed Out, IR or Doubtful are only used if you lock them.",
  },
  nba: {
    name: "NBA", dk: "NBA", tabs: ["PG", "SG", "SF", "PF", "C"], anchors: ["PG", "SG", "SF", "PF", "C"],
    modes: {
      classic: { contestType: 70, gameType: 70, name: "Classic", size: 8, header: "PG,SG,SF,PF,C,G,F,UTIL", hint: "PG, SG, SF, PF, C, G, F, UTIL",
        slotIds: { 458: "PG", 459: "SG", 460: "SF", 461: "PF", 462: "C", 464: "G", 463: "F", 465: "UTIL" },
        slotOrder: ["PG", "SG", "SF", "PF", "C", "G", "F", "UTIL"] },
      showdown: { contestType: 81, gameType: 81, name: "Showdown", size: 6, cptSlot: 476, flexName: "UTIL", header: "CPT,UTIL,UTIL,UTIL,UTIL,UTIL", hint: "1 Captain (1.5x) + 5 UTIL" },
    },
    footer: "NBA projections are Sleeper's per-game projected stats for each game on the slate, converted to DraftKings scoring: 1 per point, +0.5 per three, 1.25 per rebound, 1.5 per assist, 2 per steal or block, -0.5 per turnover, +1.5 for a double-double and +3 for a triple-double (scored as their chance). Players listed Out are only used if you lock them.",
  },
};
const NEVER_USE = new Set(["OUT", "IR", "D"]);   // DraftKings: Out, Injured Reserve, Doubtful
const NFL_FLEX = ["RB", "WR", "TE"];

const $ = id => document.getElementById(id);
const fmt$ = n => "$" + Math.round(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("caproom." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("caproom." + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

const state = { sport: store.get("sport", "nfl"), mode: store.get("mode", "classic"), slates: [], slate: null, cap: 50000,
  players: [], week: null, season: null, pos: "ALL", projCache: {}, lastBuild: null, locks: new Map() };
if (!SPORTS[state.sport]) state.sport = "nfl";
const SP = () => SPORTS[state.sport];
const M = () => SP().modes[state.mode];
const isNBA = () => state.sport === "nba";
const etDate = iso => iso ? new Date(iso).toLocaleDateString("en-CA", { timeZone: "America/New_York" }) : "";

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${new URL(url).host} answered ${r.status}`);
  return r.json();
}

/* ---------- DraftKings scoring from Sleeper projected stats ---------- */
function erfc(x) {  // Abramowitz-Stegun 7.1.26
  const z = Math.abs(x), t = 1 / (1 + 0.5 * z);
  const r = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 + t * (-0.18628806 +
    t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
  return x >= 0 ? r : 2 - r;
}
const pAtLeast = (mean, thr, sd) => mean <= 0 ? 0 : 0.5 * erfc((thr - mean) / sd / Math.SQRT2);
const PTS_ALLOWED = [[0, 0, 10], [1, 6, 7], [7, 13, 4], [14, 20, 1], [21, 27, 0], [28, 34, -1], [35, 99, -4]];

function dkPointsNFL(s, pos) {
  const g = k => +s[k] || 0;
  if (pos === "DST") {
    let pts = g("sack") + 2 * g("int") + 2 * g("fum_rec") + 2 * g("safe") + 2 * g("blk_kick") +
      6 * (g("def_td") + g("def_st_td") + g("st_td") + g("def_kr_td") + g("def_pr_td"));
    if ("pts_allow" in s) {
      const m = g("pts_allow");
      for (const [lo, hi, v] of PTS_ALLOWED) pts += v * (pAtLeast(m, lo - 0.5, 9) - pAtLeast(m, hi + 0.5, 9));
    }
    return pts;
  }
  if (pos === "K") {
    return g("xpm") + 3 * (g("fgm_0_19") + g("fgm_20_29") + g("fgm_30_39")) + 4 * g("fgm_40_49") + 5 * g("fgm_50p");
  }
  const py = g("pass_yd"), ry = g("rush_yd"), rcy = g("rec_yd");
  return 0.04 * py + 4 * g("pass_td") - g("pass_int") + 0.1 * ry + 6 * g("rush_td") +
    g("rec") + 0.1 * rcy + 6 * g("rec_td") + 2 * (g("pass_2pt") + g("rush_2pt") + g("rec_2pt")) -
    g("fum_lost") + 6 * (g("kr_td") + g("pr_td") + g("fum_rec_td")) +
    3 * pAtLeast(py, 300, 65) + 3 * pAtLeast(ry, 100, Math.max(15, 0.45 * ry)) + 3 * pAtLeast(rcy, 100, Math.max(15, 0.45 * rcy));
}

function dkPointsNBA(s) {
  const g = k => +s[k] || 0;
  return g("pts") + 0.5 * g("tpm") + 1.25 * g("reb") + 1.5 * g("ast") + 2 * g("stl") + 2 * g("blk") - 0.5 * g("to") +
    1.5 * g("dd") + 3 * g("td");
}

/* ---------- Matching DraftKings players to Sleeper projections ---------- */
const SUFFIX = new Set(["jr", "sr", "ii", "iii", "iv", "v"]);
const normName = n => n.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/-/g, " ")
  .replace(/[^a-z ]/g, "").split(/\s+/).filter(w => w && !SUFFIX.has(w)).join(" ");

// NBA projections are one record per player per game, so the key includes the game date.
function indexProjections(rows) {
  const byTeam = new Map(), byName = new Map(), defs = new Map();
  for (const r of rows) {
    if (!r.stats || !r.player) continue;
    const pl = r.player, team = r.team || pl.team, date = isNBA() ? r.date || "" : "";
    if (pl.position === "DEF") { defs.set(team, r); continue; }
    const k = normName(`${pl.first_name || ""} ${pl.last_name || ""}`) + "|" + date;
    byTeam.set(k + "|" + team, r);
    if (!byName.has(k)) byName.set(k, []);
    byName.get(k).push(r);
  }
  return { byTeam, byName, defs };
}
function findProjection(idx, p) {
  if (p.pos === "DST") return idx.defs.get(p.team);
  const k = normName(p.name) + "|" + (isNBA() ? etDate(p.start) : "");
  return idx.byTeam.get(k + "|" + p.team) || (idx.byName.get(k)?.length === 1 ? idx.byName.get(k)[0] : undefined);
}

/* ---------- Loading ---------- */
function setStatus(html) { $("status").innerHTML = html; }
function showBanner(msg) { $("banner").textContent = msg; $("banner").hidden = !msg; }

async function loadSlates() {
  const data = await getJSON(URLS.groups(SP().dk));
  const slates = data.draftGroups
    .filter(g => g.contestType?.contestTypeId === M().contestType && g.contestType?.sport === SP().dk)
    .map(g => ({ id: g.draftGroupId, label: (g.startTimeSuffix || "").trim().replace(/^\(|\)$/g, "") || "Main slate",
      games: (g.games || []).length, start: g.minStartTime, teams: (g.games || []).map(x => x.description) }))
    .sort((a, b) => a.start.localeCompare(b.start) || b.games - a.games);
  if (!slates.length) throw new Error(`DraftKings has no ${SP().name} ${M().name} slates open right now`);
  let first = slates[0];
  if (state.mode === "classic") {
    const firstDay = etDate(slates[0].start);
    first = slates.find(s => s.label === "Main slate") || slates.filter(s => etDate(s.start) === firstDay).sort((a, b) => b.games - a.games)[0];
  }
  state.slates = [first, ...slates.filter(s => s !== first)];
  $("slate").innerHTML = state.slates.map(s => {
    const d = new Date(s.start).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" });
    return `<option value="${s.id}">${esc(s.label)} - ${state.mode === "classic" ? s.games + " games, " : ""}${d}</option>`;
  }).join("");
  const keep = state.slate && state.slates.find(s => s.id === state.slate.id);
  state.slate = keep || first;
  $("slate").value = state.slate.id;
}

async function cachedJSON(url) {
  if (!state.projCache[url]) state.projCache[url] = await getJSON(url);
  return state.projCache[url];
}

function matchShare(rows, games) {
  const pairs = new Set(games.flatMap(d => { const [a, b] = d.split(/ @ | vs /); return [a + "|" + b, b + "|" + a]; }));
  const defs = rows.filter(r => r.player?.position === "DEF");
  if (!defs.length || !games.length) return 0;
  return defs.filter(r => pairs.has(r.team + "|" + r.opponent)).length / (games.length * 2);
}

async function loadSlate() {
  const slate = state.slate, mode = M();
  const [rules, dg] = await Promise.all([getJSON(URLS.rules(mode.gameType)), getJSON(URLS.draftables(slate.id))]);
  state.cap = rules.salaryCap.maxValue;
  const byPlayer = new Map();
  for (const d of dg.draftables) {
    if (d.isDisabled) continue;
    let p = byPlayer.get(d.playerId);
    if (!p) {
      p = { pid: d.playerId, name: d.displayName, pos: d.position, positions: d.position.split("/"), team: d.teamAbbreviation,
        status: d.status && d.status !== "None" ? d.status : "", game: d.competition?.name || "", start: d.competition?.startTime || "", elig: [] };
      byPlayer.set(d.playerId, p);
    }
    if (state.mode === "showdown") {
      if (d.rosterSlotId === mode.cptSlot) { p.cptId = d.draftableId; p.cptSalary = d.salary; }
      else { p.id = d.draftableId; p.salary = d.salary; }
    } else {
      // Use the player's first (primary-position) entry as his ID, like DraftKings' salary file.
      if (p.id == null || d.rosterSlotId < p.slotId) { p.id = d.draftableId; p.salary = d.salary; p.slotId = d.rosterSlotId; }
      if (mode.slotIds?.[d.rosterSlotId]) p.elig.push(mode.slotIds[d.rosterSlotId]);
    }
  }
  const players = [...byPlayer.values()].filter(p => p.id != null && (state.mode === "classic" || p.cptId != null));
  await attachProjections(players, slate.teams, "DraftKings live");
}

async function nflProjections(games) {
  const st = await getJSON(URLS.state("nfl"));
  state.season = st.season;
  // Sleeper's "current week" can lag or lead the DraftKings slate, so pick the week whose matchups fit the slate.
  let week = st.week || 1, rows = await cachedJSON(URLS.projNFL(state.season, week));
  if (matchShare(rows, games) < 0.6) {
    const next = await cachedJSON(URLS.projNFL(state.season, week + 1));
    if (matchShare(next, games) > matchShare(rows, games)) { week += 1; rows = next; }
  }
  state.week = week;
  return { rows, label: `Week <b>${week}</b> projections` };
}

async function nbaProjections(players) {
  const st = await getJSON(URLS.state("nba"));
  state.season = st.season;
  const dates = [...new Set(players.map(p => etDate(p.start)).filter(Boolean))];
  // Sleeper NBA weeks run Monday to Sunday; load the week(s) that contain this slate's game dates.
  let rows = [];
  for (const week of [st.week, st.week + 1, st.week - 1].filter(w => w > 0)) {
    const r = await cachedJSON(URLS.projNBA(state.season, week));
    if (r.some(x => dates.includes(x.date))) rows = rows.concat(r);
    const have = new Set(rows.map(x => x.date));
    if (dates.every(d => have.has(d))) break;
  }
  state.week = st.week;
  const nice = dates.map(d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }));
  return { rows, label: `Projections for <b>${nice.join(", ")}</b>` };
}

async function attachProjections(players, games, source) {
  const { rows, label } = isNBA() ? await nbaProjections(players) : await nflProjections(games);
  const idx = indexProjections(rows);
  for (const p of players) {
    const pr = findProjection(idx, p);
    const pts = pr ? (isNBA() ? dkPointsNBA(pr.stats) : dkPointsNFL(pr.stats, p.pos)) : 0;
    p.proj = Math.round(pts * 100) / 100;
  }
  state.players = players;
  loadLocks();
  const loaded = new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  setStatus(`<span>${SP().name} ${M().name}</span><span>${label}</span><span>Salary cap <b class="num">${fmt$(state.cap)}</b></span>` +
    `<span><b>${players.filter(p => p.proj > 0).length}</b> projected players</span><span>Salaries: ${esc(source)}</span><span>Updated ${loaded}</span>`);
}

/* DraftKings salary CSV (contest page > Export to CSV) - used when DraftKings blocks the live request. */
function parseCSVLine(line) {
  const out = []; let cur = "", q = false;
  for (const ch of line) {
    if (ch === '"') q = !q; else if (ch === "," && !q) { out.push(cur); cur = ""; } else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim());
}
async function loadSalaryFile(file) {
  const lines = (await file.text()).split(/\r?\n/).filter(l => l.trim());
  const head = parseCSVLine(lines[0]);
  const col = name => head.indexOf(name);
  const need = ["Position", "Name", "ID", "Roster Position", "Salary", "Game Info", "TeamAbbrev"];
  if (need.some(n => col(n) < 0)) throw new Error("that file is not a DraftKings salary export (missing " + need.filter(n => col(n) < 0).join(", ") + ")");
  const rows = lines.slice(1).map(parseCSVLine);
  const isShowdown = rows.some(c => c[col("Roster Position")] === "CPT");
  if (isShowdown !== (state.mode === "showdown")) throw new Error(`that is a ${isShowdown ? "Showdown" : "Classic"} file; switch to ${isShowdown ? "Showdown" : "Classic"} at the top first`);
  const games = new Set(), byKey = new Map();
  for (const c of rows) {
    const info = c[col("Game Info")] || "";            // e.g. "DET@MIA 11/08/2026 01:00PM ET"
    const m = info.match(/^(\w+)@(\w+)\s+(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+)(AM|PM)/);
    let game = "", start = "";
    if (m) {
      game = `${m[1]} @ ${m[2]}`; games.add(game);
      const h = +m[6] % 12 + (m[8] === "PM" ? 12 : 0);
      // Game Info is Eastern time; store an ISO time with the Eastern offset so dates stay correct.
      const local = `${m[5]}-${m[3].padStart(2, "0")}-${m[4].padStart(2, "0")}T${String(h).padStart(2, "0")}:${m[7]}:00`;
      start = new Date(local + (/^(0[4-9]|10)|^11-0[1-7]/.test(local.slice(5)) ? "-04:00" : "-05:00")).toISOString();
    }
    const id = +c[col("ID")];
    if (!id) continue;
    const key = c[col("Name")] + "|" + c[col("TeamAbbrev")];
    let p = byKey.get(key);
    if (!p) {
      p = { pid: key, name: c[col("Name")], pos: c[col("Position")], positions: c[col("Position")].split("/"), team: c[col("TeamAbbrev")], status: "", game, start, elig: [] };
      byKey.set(key, p);
    }
    const rp = c[col("Roster Position")];
    if (rp === "CPT") { p.cptId = id; p.cptSalary = +c[col("Salary")]; }
    else { p.id = id; p.salary = +c[col("Salary")]; if (isNBA() && state.mode === "classic") p.elig = rp.split("/"); }
  }
  state.cap = 50000;  // DraftKings NFL and NBA Classic and Showdown cap; the file does not include it
  state.slate = { id: "file-" + file.name, teams: [...games] };
  await attachProjections([...byKey.values()].filter(p => p.id != null), [...games], "salary file " + file.name);
}

function showDKFallback(reason) {
  const b = $("banner");
  b.hidden = false;
  b.innerHTML = `DraftKings did not answer (${esc(reason)}). To keep going, open any ${SP().name} ${M().name} contest on DraftKings, choose
    <b>Export to CSV</b> to download the salary file, then load it here: <input type="file" id="salfile" accept=".csv,text/csv">`;
  $("salfile").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try { await loadSalaryFile(f); b.hidden = true; $("slate").innerHTML = `<option>${esc(f.name)}</option>`; renderAll(); }
    catch (err) { b.insertAdjacentHTML("beforeend", `<div>Could not read that file: ${esc(err.message)}.</div>`); }
  });
}

    else $("results").innerHTML = `<div class="empty">Lock any players you want, then pick a lineup type above. Lineups use the ${fmt$(state.cap)} salary cap.</div>`;
  } catch (e) {

    setStatus("<span>Data not loaded</span>");

}

/* ---------- Locks ---------- */
const lockKey = () => `locks.${state.sport}.${state.mode}.${state.slate?.id ?? "none"}`;
function loadLocks() {
  const ids = new Set(state.players.map(p => String(p.pid)));
  state.locks = new Map(store.get(lockKey(), []).filter(([pid]) => ids.has(String(pid))));
}
function saveLocks() { store.set(lockKey(), [...state.locks]); }
const playerById = pid => state.players.find(p => String(p.pid) === String(pid));

function toggleLock(pid, kind) {
  const cur = state.locks.get(pid);
  if (cur === kind) state.locks.delete(pid);
  else {
    if (kind === "cpt") for (const [k, v] of state.locks) if (v === "cpt") state.locks.set(k, "any");  // one captain at a time
    state.locks.set(pid, kind);
  }
  saveLocks();
  renderBoard(); renderLocks();
}

function lockProblems() {
  const locked = [...state.locks].map(([pid, kind]) => ({ p: playerById(pid), kind })).filter(x => x.p);
  if (!locked.length) return "";
  const n = locked.length, size = M().size;
  if (n > size) return `You locked ${n} players, but a ${M().name} lineup only has ${size} spots.`;
  const sal = locked.reduce((a, { p, kind }) => a + (kind === "cpt" ? p.cptSalary : p.salary), 0);
  if (sal > state.cap) return `Your locked players cost ${state.mode === "showdown" ? "at least " : ""}${fmt$(sal)}, over the ${fmt$(state.cap)} cap.`;
  if (state.mode === "showdown" || isNBA()) return "";
  const count = pos => locked.filter(({ p }) => p.pos === pos).length;
  const max = { QB: 1, DST: 1, TE: 2, RB: 3, WR: 4 };
  for (const [pos, m] of Object.entries(max)) if (count(pos) > m) return `A Classic lineup can hold at most ${m} ${pos}${m > 1 ? "s" : ""}; you locked ${count(pos)}.`;
  if (count("RB") + count("WR") + count("TE") > 7) return "A Classic lineup has 7 RB/WR/TE spots in total; you locked more than that.";
  return "";
}

function renderLocks() {
  const locked = [...state.locks].map(([pid, kind]) => ({ p: playerById(pid), kind })).filter(x => x.p);
  $("lockcount").innerHTML = locked.length

    `${p.status ? `<span class="tag">${esc(p.status)}</span>` : ""}<button type="button" data-unlock="${esc(p.pid)}" aria-label="Unlock ${esc(p.name)}">Remove</button></span>`).join("");

  $("lockwarn").hidden = !problem;
}

/* ---------- Optimizer (HiGHS integer programming) ---------- */
// The HiGHS WebAssembly build becomes unstable after several solves in one page, so every
// solve runs in its own short-lived Web Worker with a clean copy of the solver.
const WORKER_URL = URL.createObjectURL(new Blob([`
  importScripts("${HIGHS_CDN}highs.js");
  onmessage = async e => {
    try {
      const highs = await Module({ locateFile: f => "${HIGHS_CDN}" + f });
      const r = highs.solve(e.data);
      const cols = {};
      for (const [k, c] of Object.entries(r.Columns || {})) cols[k] = c.Primal;
      postMessage({ status: r.Status, cols });
    } catch (err) { postMessage({ error: String(err && err.message || err) }); }
  };`], { type: "text/javascript" }));

function solveLP(lp) {
  return new Promise((resolve, reject) => {
    const w = new Worker(WORKER_URL);
    const timer = setTimeout(() => { w.terminate(); reject(new Error("the solver took too long")); }, 60000);
    w.onmessage = e => { clearTimeout(timer); w.terminate(); e.data.error ? reject(new Error(e.data.error)) : resolve(e.data); };
    w.onerror = e => { clearTimeout(timer); w.terminate(); reject(new Error(e.message || "the solver could not load")); };
    w.postMessage(lp);
  });
}

function lpSum(terms) {  // keep LP-format lines short
  const out = [];
  for (let i = 0; i < terms.length; i += 8) out.push(terms.slice(i, i + 8).join(" "));
  return out.join("\n  ");
}

/* One decision variable per (player, slot):
   NFL Classic - one per player (positions are counted);
   NBA Classic - one per roster slot the player is eligible for (PG, G, UTIL...);
   Showdown    - one for Captain and one for FLEX/UTIL. */
function entriesFor(pool) {
  const mode = M();
  if (state.mode === "showdown") return pool.flatMap(p => [
    { p, slot: "CPT", salary: p.cptSalary, proj: Math.round(p.proj * 150) / 100, id: p.cptId },
    { p, slot: mode.flexName, salary: p.salary, proj: p.proj, id: p.id },
  ]);
  if (isNBA()) return pool.flatMap(p => p.elig.map(slot => ({ p, slot, salary: p.salary, proj: p.proj, id: p.id })));
  return pool.map(p => ({ p, slot: p.pos, salary: p.salary, proj: p.proj, id: p.id }));
}

// locks: Map pid -> "any" | "cpt". previous: earlier lineups this lineup must differ from (by players).
async function solveOne(pool, { locks = new Map(), previous = [], minDiff = 1 } = {}) {
  const E = entriesFor(pool), v = i => "x" + i, size = M().size;
  const sum = (filter, coef) => lpSum(E.map((e, i) => filter(e) ? `+ ${coef ? coef(e) : 1} ${v(i)}` : null).filter(Boolean));
  const lines = ["Maximize", " obj: " + lpSum(E.map((e, i) => `+ ${e.proj.toFixed(2)} ${v(i)}`)), "Subject To"];
  lines.push(" cap: " + sum(() => true, e => e.salary) + " <= " + state.cap);
  lines.push(" size: " + sum(() => true) + " = " + size);
  if (state.mode === "showdown" || isNBA()) pool.forEach((p, k) => lines.push(` once${k}: ` + sum(e => e.p === p) + " <= 1"));
  if (state.mode === "showdown") {
    lines.push(" cpt: " + sum(e => e.slot === "CPT") + " = 1");
    [...new Set(pool.map(p => p.team))].forEach((t, k) => lines.push(` team${k}: ` + sum(e => e.p.team === t) + " >= 1"));
  } else if (isNBA()) {
    M().slotOrder.forEach(slot => lines.push(` s${slot}: ` + (sum(e => e.slot === slot) || "0 x0") + " = 1"));
  } else {
    lines.push(" qb: " + sum(e => e.p.pos === "QB") + " = 1");
    lines.push(" dst: " + sum(e => e.p.pos === "DST") + " = 1");
    lines.push(" rb: " + sum(e => e.p.pos === "RB") + " >= 2");
    lines.push(" wr: " + sum(e => e.p.pos === "WR") + " >= 3");
    lines.push(" te1: " + sum(e => e.p.pos === "TE") + " >= 1");
    lines.push(" te2: " + sum(e => e.p.pos === "TE") + " <= 2");
  }
  let k = 0;
  for (const [pid, kind] of locks) {
    const terms = E.map((e, i) => String(e.p.pid) === String(pid) && (kind !== "cpt" || e.slot === "CPT") ? `+ 1 ${v(i)}` : null).filter(Boolean);
    if (!terms.length) return null;   // locked player is not in this pool
    lines.push(` lock${k++}: ${lpSum(terms)} = 1`);
  }
  previous.forEach((lu, j) => {
    // Showdown counts the same player at a different slot as a change; Classic compares players only.
    const keyOf = e => state.mode === "showdown" ? e.p.pid + "|" + e.slot : String(e.p.pid);
    const keys = new Set(lu.picks.map(keyOf));
    const t = E.map((e, i) => keys.has(keyOf(e)) ? `+ 1 ${v(i)}` : null).filter(Boolean);
    if (t.length) lines.push(` diff${j}: ${lpSum(t)} <= ${size - minDiff}`);
  });
  lines.push("Binary", " " + lpSum(E.map((_, i) => v(i))), "End");
  const res = await solveLP(lines.join("\n"));
  if (res.status !== "Optimal") return null;
  return orderLineup(E.filter((_, i) => res.cols[v(i)] > 0.5));
}

function orderLineup(picks) {
  let slots;
  if (state.mode === "showdown") {
    slots = [...picks].sort((a, b) => (a.slot !== "CPT") - (b.slot !== "CPT") || b.salary - a.salary).map(e => [e.slot, e]);
  } else if (isNBA()) {
    const order = M().slotOrder;
    slots = [...picks].sort((a, b) => order.indexOf(a.slot) - order.indexOf(b.slot)).map(e => [e.slot, e]);
  } else {
    // Extra RB/WR/TE goes to FLEX; use the latest kickoff at that position so late swap stays open.
    const need = { QB: 1, RB: 2, WR: 3, TE: 1, DST: 1 };
    const byPos = {};
    [...picks].sort((a, b) => a.p.start.localeCompare(b.p.start)).forEach(e => (byPos[e.p.pos] ||= []).push(e));
    const extra = NFL_FLEX.find(pos => (byPos[pos] || []).length > need[pos]);
    const flex = byPos[extra].pop();
    slots = [];
    for (const pos of ["QB", "RB", "WR", "TE"]) byPos[pos].forEach(e => slots.push([pos, e]));
    slots.push(["FLEX", flex], ["DST", byPos.DST[0]]);
  }
  return { slots, picks: slots.map(s => s[1]), salary: picks.reduce((a, e) => a + e.salary, 0), proj: picks.reduce((a, e) => a + e.proj, 0) };
}

/* ---------- Player pools and lineup types ---------- */
const isLocked = p => state.locks.has(p.pid);
const available = () => state.players.filter(p => isLocked(p) || (p.proj > 0 && !NEVER_USE.has(p.status)));
const floorFor = p => {
  if (isNBA()) return +$("minnba").value || 0;
  if (p.pos === "DST" || p.pos === "K") return 0;
  return p.pos === "QB" ? +$("minqb").value || 0 : +$("minsal").value || 0;
};
function balancedPool(anchor) {
  const noQ = $("noq").checked;
  return available().filter(p => p === anchor || isLocked(p) || (p.salary >= floorFor(p) && !(noQ && p.status === "Q")));
}
const balancedRule = () => (isNBA() ? `no player under ${fmt$(+$("minnba").value || 0)}`
  : `no QB under ${fmt$(+$("minqb").value || 0)}, no RB, WR or TE under ${fmt$(+$("minsal").value || 0)}`) +
  (state.mode === "showdown" ? ` (${M().flexName} price)` : "") + ($("noq").checked ? ", and no Questionable players" : "");
const lockNote = () => state.locks.size ? ` Your ${state.locks.size} locked player${state.locks.size > 1 ? "s are" : " is"} included.` : "";

const BUILDS = {
  mine: {
    title: "Best Around My Locks",
    explain: () => state.locks.size
      ? `The five highest-projected lineups that include your ${state.locks.size} locked player${state.locks.size > 1 ? "s" : ""}, filled with any healthy players.`
      : "",
    run: async () => state.locks.size ? topN(available(), 5) : [],
    empty: "Lock at least one player on the projections board first, then build again.",
  },
  balanced: {
    title: "Top 5 Balanced",
    explain: () => `The five highest-projected lineups with ${balancedRule()}.` + lockNote(),
    run: async () => topN(balancedPool(), 5),
  },
  projected: {
    title: "Top 5 Projected",
    explain: () => "The five highest projected point totals possible under the cap, with any healthy player allowed." + lockNote(),
    run: async () => topN(available(), 5),
  },
};
function anchorBuild(pos) {
  return {
    title: `Top ${pos} Lineup`,
    anchor: () => state.players.filter(p => p.positions.includes(pos) && p.proj > 0 && !NEVER_USE.has(p.status)).sort((a, b) => b.proj - a.proj)[0],
    explain() {
      const a = this.anchor(); if (!a) return "";
      const role = state.mode === "showdown" ? `at Captain (${(a.proj * 1.5).toFixed(2)} pts, ${fmt$(a.cptSalary)})` : `(${a.proj.toFixed(2)} pts, ${fmt$(a.salary)})`;
      return `Starts with ${a.name}, the top projected ${pos} ${role}, then fills the highest-projected lineup around him with ${balancedRule()}.` + lockNote();
    },
    async run() {
      const a = this.anchor(); if (!a) return [];
      const locks = new Map(state.locks);
      locks.set(a.pid, state.mode === "showdown" ? "cpt" : (locks.get(a.pid) || "any"));
      const lu = await solveOne(balancedPool(a), { locks });
      return lu ? [lu] : [];
    },
  };
}
const buildFor = key => BUILDS[key] || anchorBuild(key);

async function topN(pool, n) {
  const lineups = [];
  for (let k = 0; k < n; k++) {
    const lu = await solveOne(pool, { locks: state.locks, previous: lineups, minDiff: 1 });
    if (!lu) break;
    lineups.push(lu);
  }
  return lineups;
}

function lineupHTML(lu, label, anchorPid) {
  const left = state.cap - lu.salary;
  const rows = lu.slots.map(([slot, e]) => {
    const p = e.p, lk = isLocked(p);
    return `<tr class="${String(p.pid) === String(anchorPid) || lk ? "anchor" : ""}">
    <td class="slot${slot === "CPT" ? " cpt" : ""}">${slot}</td>
    <td class="player">${esc(p.name)}${p.status ? `<span class="tag">${esc(p.status)}</span>` : ""}<small>${esc(p.team)} ${p.pos !== slot ? esc(p.pos) : ""}${lk ? " - locked" : ""}</small></td>
    <td class="muted">${esc(p.game)}</td>
    <td class="r num">${fmt$(e.salary)}</td>
    <td class="r num"><b>${e.proj.toFixed(2)}</b></td></tr>`;
  }).join("");
  return `<article class="lineup">
    <div class="lineup-top"><h3>${esc(label)}</h3>
      <div class="figs num"><span><b>${lu.proj.toFixed(2)}</b> pts</span><span>${fmt$(lu.salary)}</span><span class="${left ? "left-gold" : "muted"}">${fmt$(left)} left</span></div></div>
    <div class="table-scroll" style="max-height:none;border-top:0"><table><tbody>${rows}</tbody></table></div>
  </article>`;
}

function uploadCSV(lineups) {
  return M().header + "\n" + lineups.map(lu => lu.picks.map(e => e.id).join(",")).join("\n") + "\n";
}

async function runBuild(keys) {
  state.lastBuild = keys;
  document.querySelectorAll(".build").forEach(b => b.setAttribute("aria-pressed", keys.length === 1 && b.dataset.build === keys[0]));
  const box = $("results");
  const problem = lockProblems();
  if (problem) { box.innerHTML = `<div class="empty">${esc(problem)} Remove a locked player and build again.</div>`; return; }
  box.innerHTML = `<div class="empty">Building ${keys.length > 1 ? "all lineup types" : buildFor(keys[0]).title}...</div>`;
  document.querySelectorAll(".build, #buildall").forEach(b => b.disabled = true);
  try {
    let html = "", all = [];
    for (const key of keys) {
      const b = buildFor(key);
      const lineups = await b.run();
      const anchorPid = b.anchor ? b.anchor()?.pid : null;
      all.push(...lineups);
      html += `<div class="result-head"><h2>${esc(b.title)}</h2></div>`;
      const ex = b.explain(); if (ex) html += `<p class="explain">${esc(ex)}</p>`;
      const why = b.empty && !state.locks.size ? b.empty
        : state.locks.size ? "No lineup fits under the cap with your locked players and these rules. Remove a lock or lower the salary minimums in Balanced lineup rules."
        : "No lineup fits these rules under the cap. Lower the salary minimums in Balanced lineup rules.";
      html += lineups.length ? lineups.map((lu, i) => lineupHTML(lu, lineups.length > 1 ? `Lineup ${i + 1}` : b.title, anchorPid)).join("")
        : `<div class="empty">${esc(why)}</div>`;
    }
    if (all.length) {
      const csv = uploadCSV(all);
      const href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      html += `<div class="export"><a href="${href}" download="dk_${state.sport}_${state.mode}_lineups.csv"><button type="button" tabindex="-1">Download DraftKings upload file</button></a>
        <button type="button" id="copycsv">Copy upload file</button><span class="muted">On DraftKings: Lineups, then Upload Lineups.</span></div>`;
      box.innerHTML = html;
      $("copycsv").onclick = async e => {
        try { await navigator.clipboard.writeText(csv); e.target.textContent = "Copied"; } catch { e.target.textContent = "Copy failed"; }
      };
    } else box.innerHTML = html;
  } catch (e) {
    box.innerHTML = `<div class="empty">Could not build lineups: ${esc(e.message)}. Press Refresh and try again.</div>`;
  } finally { document.querySelectorAll(".build, #buildall").forEach(b => b.disabled = false); }
}

/* ---------- Wiring ---------- */
$("postabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { setPos(b.dataset.pos); renderBoard(); } });
$("board").addEventListener("click", e => {
  const b = e.target.closest(".lockbtn"); if (!b) return;
  const p = playerById(b.dataset.pid); if (p) toggleLock(p.pid, b.dataset.lock);
});
$("chips").addEventListener("click", e => {
  const b = e.target.closest("[data-unlock]"); if (!b) return;
  const p = playerById(b.dataset.unlock); if (p) { state.locks.delete(p.pid); saveLocks(); renderAll(); }
});
$("clearlocks").addEventListener("click", () => { state.locks.clear(); saveLocks(); renderAll(); });
$("builds").addEventListener("click", e => { const b = e.target.closest(".build"); if (b) runBuild([b.dataset.build]); });
$("buildall").addEventListener("click", () => runBuild(["balanced", "projected", ...SP().anchors]));
$("refresh").addEventListener("click", () => { state.projCache = {}; loadAll(); });
function switchTo(change) {
  Object.assign(state, change, { slate: null, lastBuild: null, players: [] });
  store.set("sport", state.sport); store.set("mode", state.mode);
  $("board").innerHTML = `<tr><td colspan="8" class="muted">Loading players...</td></tr>`;
  loadAll();
}
$("sport").addEventListener("click", e => { const b = e.target.closest("button"); if (b && b.dataset.sport !== state.sport) switchTo({ sport: b.dataset.sport }); });
$("mode").addEventListener("click", e => { const b = e.target.closest("button"); if (b && b.dataset.mode !== state.mode) switchTo({ mode: b.dataset.mode }); });
$("slate").addEventListener("change", async e => {
  state.slate = state.slates.find(s => s.id === +e.target.value);
  $("refresh").disabled = true;
  try { await loadSlate(); showBanner(""); renderAll(); if (state.lastBuild) await runBuild(state.lastBuild); }
  catch (err) { showDKFallback(err.message); }
  finally { $("refresh").disabled = false; }
});
["minqb", "minsal", "minnba", "noq"].forEach(id => $(id).addEventListener("change", () => { if (state.lastBuild) runBuild(state.lastBuild); }));
loadAll();
</script>
</body>
</html>
